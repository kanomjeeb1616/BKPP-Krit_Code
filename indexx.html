<body>
<div class="phone">
  <div class="island"></div>
  <div class="status"><span id="statusTime">9:41</span><span>▂▄▆ ◕ ▰</span></div>
  <section id="lock" class="screen lock" onclick="openPass()"><div id="lockDate" class="lockdate"></div><div id="lockTime" class="locktime">9:41</div><div class="hint">Swipe up to unlock ↑</div></section>
  <section id="pass" class="screen pass hidden"><h2>Enter Passcode</h2><div id="dots" class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="error" class="error"></div><div class="keypad"><button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button><button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button><button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button><button class="key small" onclick="show('lock')">Cancel</button><button class="key" onclick="press('0')">0</button><button class="key small" onclick="erase()">Delete</button></div></section>
  <section id="home" class="screen home hidden"><div class="widget glass"><div id="widgetDate" class="date"></div><div class="name">PP KRIT</div></div><div class="dock glass"><button aria-label="Photos" onclick="openApp('photos')"><img src="photos-icon.png" alt="Photos"></button><button aria-label="Messages" onclick="openApp('messages')"><img src="messages-icon.png" alt="Messages"></button><button aria-label="Notes" onclick="openApp('notes')"><img src="notes-icon.png" alt="Notes"></button><button aria-label="Music" onclick="openApp('music')"><img src="music-icon.png" alt="Music"></button></div></section>
  <section id="page" class="screen page hidden"><button class="back" onclick="goHome()">‹ Home</button><h1 id="pageTitle"></h1><div id="content"></div></section>
  <div class="indicator" onclick="goHome()"></div>
  <div id="viewer" class="viewer hidden"><button onclick="closePhoto()">Done</button><img id="largePhoto" alt="Photo"></div>
</div>
<script>
const PASSCODE='081042';let entered='';let unlocked=false;const el=id=>document.getElementById(id);
function show(id){['lock','pass','home','page'].forEach(name=>el(name).classList.toggle('hidden',name!==id))}
function clock(){const d=new Date();const t=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});el('statusTime').textContent=t;el('lockTime').textContent=t;el('lockDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});el('widgetDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}clock();setInterval(clock,30000);
function updateDots(){document.querySelectorAll('#dots .dot').forEach((dot,i)=>dot.classList.toggle('filled',i<entered.length))}
function openPass(){entered='';el('error').textContent='';updateDots();show('pass')}
function press(number){if(entered.length>=6)return;entered+=number;updateDots();if(entered.length===6){if(entered===PASSCODE){unlocked=true;setTimeout(()=>show('home'),180)}else{setTimeout(()=>{entered='';updateDots();el('error').textContent='Incorrect Passcode'},300)}}}
